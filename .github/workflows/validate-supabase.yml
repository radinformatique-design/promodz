name: Validate Supabase integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/supabase-auth-foundation]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and reconcile lockfile
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/batiprom
      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/batiprom
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/batiprom
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-publishable-key
